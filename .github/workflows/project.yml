name: Python application

on: [push]

jobs:

  build:

    runs-on: ubuntu-latest

    env:
      API_ADDRESS: ${{ secrets.API_ADDRESS }}
      LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
      LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
    - uses: actions/checkout@v1
    - name: Set up Python 3.14
      uses: actions/setup-python@v1
      with:
        python-version: 3.14
    - name: Install System Dependencies
      run: |
        #pyaudio needs these dependencies to work
        sudo apt-get update
        sudo apt-get install -y portaudio19-dev
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        #adds model
        wget -O vosk-model-small-en-us-0.15.zip \
            https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip \
            && unzip vosk-model-small-en-us-0.15.zip
    - name: Lint with flake8
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count  --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pip install pytest
        python -m pytest
    - name: Copy files to server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: server/db.sqlite3
        target: /opt/Room_booking_serve
        strip_components: 1
    - name: Deploy to Digital Ocean
      if: success()
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /opt/Room_booking_serve
          source venv/bin/activate
          git pull
          pip install -r requirements.txt
          python manage.py migrate
          systemctl restart roombooking
